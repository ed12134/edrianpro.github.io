<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav role="navigation" aria-label="Primary Navigation">
      <div class="logo" tabindex="0">Ian_Cruz</div>
      <div class="nav-links">
        <a href="Portfolio.html">Back to Portfolio</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light theme" type="button" id="themeToggle" aria-pressed="false">🌙</button>
    </nav>
  </header>

  <main>
    <section class="hero container" id="hero" role="region" aria-label="404 Error Section">
      <h1>404</h1>
      <p>Oops! The page you're looking for doesn't exist. It might have been moved or deleted.</p>
      <button class="btn-primary" onclick="window.location.href='Portfolio.html'" aria-label="Go back to Portfolio">Go Back Home</button>
    </section>
  </main>

  <script>
    // Theme toggler: toggle dark/light theme with localStorage persistence
    const themeToggleBtn = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    
    function setTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggleBtn.textContent = '☀️';
        themeToggleBtn.setAttribute('aria-pressed', 'true');
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeToggleBtn.textContent = '🌙';
        themeToggleBtn.setAttribute('aria-pressed', 'false');
      }
      localStorage.setItem('theme', theme);
    }
    
    function toggleTheme() {
      const currentTheme = localStorage.getItem('theme') || 
                         (prefersDarkScheme.matches ? 'dark' : 'light');
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }
    
    // Initialize theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      setTheme(savedTheme);
    } else if (prefersDarkScheme.matches) {
      setTheme('dark');
    } else {
      setTheme('light');
    }
    
    themeToggleBtn.addEventListener('click', toggleTheme);
  </script>

  <footer>
    <div class="social-links" role="region" aria-label="Social Media Links">
      <a href="https://github.com/ed12134" target="_blank" rel="noopener" aria-label="GitHub Profile" tabindex="0">
        <img src="Images/LOGO/github1.png" alt="GitHub Logo" class="social-icon">
      </a>
      <a href="https://www.linkedin.com/in/edrian-aguilar-0b2007270/" target="_blank" rel="noopener" aria-label="LinkedIn Profile" tabindex="0">
        <img src="Images/LOGO/linkedin.png" alt="LinkedIn Logo" class="social-icon">
      </a>
      <a href="https://www.instagram.com/ian._cruz/#" target="_blank" rel="noopener" aria-label="Instagram Profile" tabindex="0">
        <img src="Images/LOGO/facebook.png" alt="Instagram Logo" class="social-icon">
      </a>
    </div>
    &copy; 2025 Ian_Cruz. All rights reserved.
  </footer>
</body>
</html>
